[pytest]
# Local pytest config for the model-inference-agent test suite.
# Scoping rootdir here ensures CI / local runs use the markers and time budget
# described in Requirement 8.15 (full PBT suite under 5 minutes).
testpaths = tests
markers =
    integration: tests that require real AWS resources (S3 / SageMaker) or
        external network access and are skipped in the default unit/PBT run.
# Req 8.15: CI time budget. pytest-timeout is optional; if not installed,
# addopts below fails gracefully because -p no:timeout is not forced.
# Enable via requirements-test.txt.
addopts = -ra --timeout=300 --timeout-method=thread
filterwarnings =
    ignore::DeprecationWarning
